# Construit l'APK de débogage à chaque push et le publie comme artefact (onglet Actions du dépôt).
# Les machines GitHub « ubuntu-latest » disposent du SDK Android ; AGP télécharge les composants manquants.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Tests des modules de calcul (sans SDK Android)
        run: ./gradlew -Pcdc.jvmOnly=true test --no-daemon --console=plain

      - name: Compiler l'APK de débogage
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: carte-du-ciel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Téléchargement direct : pré-version « debug-latest » recréée à chaque compilation réussie.
      # URL stable : https://github.com/<propriétaire>/<dépôt>/releases/download/debug-latest/carte-du-ciel-debug.apk
      - name: Publier l'APK en téléchargement direct (pré-version debug-latest)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk carte-du-ciel-debug.apk
          gh release delete debug-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create debug-latest carte-du-ciel-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK de débogage (dernière compilation)" \
            --notes "Compilation automatique du commit $GITHUB_SHA (branche $GITHUB_REF_NAME). APK de débogage signé avec la clé de débogage, non testé sur appareil."

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-tests
          path: '**/build/reports/tests/test/'
          if-no-files-found: ignore
